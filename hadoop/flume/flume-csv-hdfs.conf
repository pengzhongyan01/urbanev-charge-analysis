# ==============================================================================
# flume-csv-hdfs.conf —— 12 个 CSV 目录采集到 HDFS（每表一个独立通道）
#
# 维护人：A（组长）　|　交付：11/24　|　消费方：苏静（B 组）
#
# 数据流：
#   <数据目录>/*.csv  →  [taildir]  →  [memory channel]  →  [HDFS Sink]
#        →  hdfs://namenode:8020/uev/raw/<表名>/
#
# ★ 为什么是 12 个独立通道而不是 1 个通道 12 个文件：
#   12 个 CSV 的表结构完全不同（6 个宽表 + 2 个矩阵 + 2 个气象长表 + 维表 + POI），
#   若混在同一个 HDFS 目录里，B 岗无法按表建 Hive 表、也无法按表做增量。
#   每个 CSV 一个 source/channel/sink，落 HDFS 独立子目录，与 Hive 建表脚本一一对应：
#     uev_ods.occupancy   ←  uev/raw/occupancy/
#     uev_ods.duration    ←  uev/raw/duration/
#     ... 共 12 张 ODS 表
#
# 采集策略：
#   - taildir 增量监控，positionFile 记录字节偏移，中断后自动续传，不重复入库
#   - fileHeader=true 跳过每个文件的首行表头（12 个 CSV 都有表头行）
#   - HDFS Sink 按时间滚动（rollInterval=300s / rollSize=128MB），gzip 压缩
#
# 启动（Docker 模式，仓库根目录执行）：
#   docker compose --profile hadoop up -d namenode datanode
#   bash scripts/start_flume.sh
#
# 校验：
#   hdfs dfs -ls /uev/raw/            # 应看到 12 个子目录
#   hdfs dfs -ls /uev/raw/occupancy/ # 应看到滚动生成的 csv.gz
#
# ★ 数据目录不写死：由 start_flume.sh 通过环境变量注入
#   优先级：环境变量 UEV_DATA_DIR > 仓库内 data/raw/ > ../数据/UrbanEV/ > 更上层
# ==============================================================================

uev-agent.sources  = s_occupancy s_duration s_volume s_volume_11kW s_e_price s_s_price s_inf s_poi s_adj s_distance s_weather_airport s_weather_central
uev-agent.channels = c_occupancy c_duration c_volume c_volume_11kW c_e_price c_s_price c_inf c_poi c_adj c_distance c_weather_airport c_weather_central
uev-agent.sinks    = k_occupancy k_duration k_volume k_volume_11kW k_e_price k_s_price k_inf k_poi k_adj k_distance k_weather_airport k_weather_central

# ---- 全局参数（可用环境变量覆盖）----
flume.source.dir = ${FLUME_SOURCE_DIR}
flume.checkpoint.dir = ${FLUME_CHECKPOINT_DIR}
flume.hdfs.base = ${FLUME_HDFS_BASE}

# ==============================================================================
# occupancy.csv  —— 充电桩占用率（比例 0~1）（时序宽表）
# ==============================================================================
uev-agent.sources.s_occupancy.type = TAILDIR
uev-agent.sources.s_occupancy.positionFile = ${flume.checkpoint.dir}/pos_occupancy.json
uev-agent.sources.s_occupancy.filegroups = f_occupancy
uev-agent.sources.s_occupancy.filegroups.f_occupancy = ${flume.source.dir}/occupancy\.csv
uev-agent.sources.s_occupancy.fileHeader = true
uev-agent.sources.s_occupancy.batchSize = 500
uev-agent.sources.s_occupancy.maxBytesPerEvent = 1048576
uev-agent.channels.c_occupancy.type = memory
uev-agent.channels.c_occupancy.capacity = 20000
uev-agent.channels.c_occupancy.byteCapacity = 268435456
uev-agent.channels.c_occupancy.keep-alive = 60
uev-agent.sinks.k_occupancy.type = hdfs
uev-agent.sinks.k_occupancy.channel = c_occupancy
uev-agent.sinks.k_occupancy.hdfs.path = ${flume.hdfs.base}/occupancy/
uev-agent.sinks.k_occupancy.hdfs.filePrefix = occupancy-%Y-%m-%d
uev-agent.sinks.k_occupancy.hdfs.fileSuffix = .csv
uev-agent.sinks.k_occupancy.hdfs.fileType = DataStream
uev-agent.sinks.k_occupancy.hdfs.writeFormat = CompressedText
uev-agent.sinks.k_occupancy.hdfs.codec = gzip
uev-agent.sinks.k_occupancy.hdfs.batchSize = ${FLUME_HDFS_BATCH_SIZE}
uev-agent.sinks.k_occupancy.hdfs.batchInterval = ${FLUME_HDFS_BATCH_INTERVAL}
uev-agent.sinks.k_occupancy.hdfs.rollSize = 134217728
uev-agent.sinks.k_occupancy.hdfs.rollInterval = 300
uev-agent.sinks.k_occupancy.hdfs.rollCount = 0
uev-agent.sinks.k_occupancy.hdfs.useLocalTimeStamp = false
uev-agent.sinks.k_occupancy.hdfs.closeOnEOF = true

