# ==============================================================================
# flume-csv-hdfs.conf —— 12 个 CSV 采集到 HDFS（每表一个独立通道）
#
# 维护人：A（组长）　|　消费方：苏静（B 组）
#
# ★ 本文件在 2026-11-20 做过一次重大修正，原因如下（原版 4 个阻断级缺陷）：
#   ① 原来只有 1 个 sink，12 个 CSV 会混进同一个文件，B 岗无法按表建 Hive 表
#   ② 原来引用 ${flume.source.dir} 等自定义键 —— Flume 只解析 agent.<name>.* 前缀的键，
#      这种间接层不可靠，且变量根本没人注入 → 改成直接写死容器内路径
#   ③ 原来 fileType=DataStream + codec=gzip —— Flume 手册明确写 DataStream 不压缩，
#      gzip 不生效，产出的不是 .gz；且 writeFormat=CompressedText 也不是合法值
#      （只允许 Text / Writable），若生效会让 MR 的 split(",") 只切出 1 列 → 宽转长 0 行
#   ④ 原来 useLocalTimeStamp=false + filePrefix 含 %Y-%m-%d，却没有 timestamp 拦截器
#      —— Flume 手册要求事件必须带名为 "timestamp" 的 header，否则报错
#
# 现在的取值逻辑：
#   fileType = DataStream（纯文本，不压缩）
#     → MR 的 TextInputFormat 能直接读，不会把 gzip 字节当文本读成乱码
#     → Hive 侧用 STORED AS TEXTFILE + skip.header.lines.count='1' 跳过表头
#   useLocalTimeStamp = true（用本机时间，不依赖 timestamp header）
#   fileHeader = true —— ★ 语义是「给事件加一个存绝对路径的 header」，
#     **不是**「跳过首行」；跳过表头请在 Hive 建表时用 skip.header.lines.count
#
# 数据流：
#   /data/urbanev/<表名>.csv  →  [taildir]  →  [memory channel]  →  [HDFS Sink]
#        →  hdfs://namenode:8020/uev/raw/<表名>/
#
# 容器内数据目录由 docker-compose.yml bind mount 进来（./data/urbanev → /data/urbanev），
# 宿主机上的实际路径由 scripts/find_data.sh 探测后决定，容器内路径固定不变。
#
# 启动：docker compose --profile hadoop up -d flume
# 校验：hdfs dfs -ls /uev/raw/            # 应看到 12 个子目录
#       hdfs dfs -cat '/uev/raw/occupancy/*.csv' | head -3
#       ★ rollInterval=300 + inUseSuffix=.tmp → 前 5 分钟只有 .tmp，验证请等 ≥5 分钟
# ==============================================================================

uev-agent.sources  = s_occupancy s_duration s_volume s_volume_11kW s_e_price s_s_price s_inf s_poi s_adj s_distance s_weather_airport s_weather_central
uev-agent.channels = c_occupancy c_duration c_volume c_volume_11kW c_e_price c_s_price c_inf c_poi c_adj c_distance c_weather_airport c_weather_central
uev-agent.sinks    = k_occupancy k_duration k_volume k_volume_11kW k_e_price k_s_price k_inf k_poi k_adj k_distance k_weather_airport k_weather_central


# ==============================================================================
# occupancy.csv  —— 充电桩占用率（比例 0~1）（时序宽表）
# ==============================================================================
uev-agent.sources.s_occupancy.type = TAILDIR
uev-agent.sources.s_occupancy.positionFile = /opt/flume/checkpoint/pos_occupancy.json
uev-agent.sources.s_occupancy.filegroups = f_occupancy
uev-agent.sources.s_occupancy.filegroups.f_occupancy = /data/urbanev/occupancy\.csv
uev-agent.sources.s_occupancy.fileHeader = true
uev-agent.sources.s_occupancy.batchSize = 500
uev-agent.sources.s_occupancy.maxBytesPerEvent = 1048576
uev-agent.channels.c_occupancy.type = memory
uev-agent.channels.c_occupancy.capacity = 20000
uev-agent.channels.c_occupancy.byteCapacity = 33554432
uev-agent.channels.c_occupancy.keep-alive = 60
uev-agent.sinks.k_occupancy.type = hdfs
uev-agent.sinks.k_occupancy.channel = c_occupancy
uev-agent.sinks.k_occupancy.hdfs.path = hdfs://namenode:8020/uev/raw/occupancy/
uev-agent.sinks.k_occupancy.hdfs.filePrefix = occupancy-
uev-agent.sinks.k_occupancy.hdfs.fileSuffix = .csv
uev-agent.sinks.k_occupancy.hdfs.fileType = DataStream
uev-agent.sinks.k_occupancy.hdfs.writeFormat = Text
uev-agent.sinks.k_occupancy.hdfs.useLocalTimeStamp = true
uev-agent.sinks.k_occupancy.hdfs.rollSize = 134217728
uev-agent.sinks.k_occupancy.hdfs.rollInterval = 300
uev-agent.sinks.k_occupancy.hdfs.rollCount = 0
uev-agent.sinks.k_occupancy.hdfs.batchSize = 100

