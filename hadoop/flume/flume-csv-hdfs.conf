# ==============================================================================
# flume-csv-hdfs.conf —— CSV 目录采集到 HDFS
#
# 维护人：A（组长）　|　交付：11/24　|　消费方：苏静（B 组）
#
# 数据流：
#   data/raw/*.csv  →  [spooldir]  →  [taildir]  →  [avro-kafka-less HDFS Sink]  →  hdfs://namenode:8020/uev/raw/
#
# 采集策略：
#   - 采用 taildir（增量监控），避免重复采集已入库数据
#   - 每个 CSV 单独一个 sink，落到 HDFS 的独立目录，方便后续按表建模
#   - 检查点记录文件偏移量，中断后自动续传
#
# 启动：
#   flume-ng agent --name uev-agent --conf $FLUME_HOME/conf \
#        --conf-file hadoop/flume/flume-csv-hdfs.conf
# ==============================================================================

# ---- 公共部分：定义 agent ----
uev-agent.sources  = csvsrc
uev-agent.channels = memchan
uev-agent.sinks    = hdfssink

# ==============================================================================
# Source —— taildir 增量采集
# ==============================================================================
# 监控目录：项目下的 data/raw
uev-agent.sources.csvsrc.type = TAILDIR
uev-agent.sources.csvsrc.positionFile = /opt/flume/checkpoint/uev-csv.json
uev-agent.sources.csvsrc.filegroups = f1
# 支持正则通配，*.csv 匹配全部原始文件
uev-agent.sources.csvsrc.filegroups.f1 = /home/uev/data/raw/.*\.csv
uev-agent.sources.csvsrc.fileHeader = true
uev-agent.sources.csvsrc.batchSize = 500
uev-agent.sources.csvsrc.maxBytesPerEvent = 1048576
uev-agent.sources.csvsrc.interceptors = ts
uev-agent.sources.csvsrc.interceptors.ts.type = timestamp
uev-agent.sources.csvsrc.interceptors.ts.headerName = collect_time
uev-agent.sources.csvsrc.interceptors.ts.preserve = false

# ==============================================================================
# Channel —— 内存通道
# ==============================================================================
# 演示/作业场景数据量不大（最大单文件 32MB），内存通道足够且速度快
uev-agent.channels.memchan.type = memory
uev-agent.channels.memchan.capacity = 20000
uev-agent.channels.memchan.byteCapacity = 268435456   # 256MB
uev-agent.channels.memchan.keep-alive = 60

# ==============================================================================
# Sink —— 写入 HDFS
# ==============================================================================
uev-agent.sinks.hdfssink.type = hdfs
uev-agent.sinks.hdfssink.hdfs.path = hdfs://namenode:8020/uev/raw/
uev-agent.sinks.hdfssink.hdfs.filePrefix = uev-%Y-%m-%d
uev-agent.sinks.hdfssink.hdfs.fileSuffix = .csv
uev-agent.sinks.hdfssink.hdfs.fileType = DataStream
uev-agent.sinks.hdfssink.hdfs.useLocalTimeStamp = false
uev-agent.sinks.hdfssink.hdfs.writeFormat = CompressedText
uev-agent.sinks.hdfssink.hdfs.codec = gzip
uev-agent.sinks.hdfssink.hdfs.batchSize = ${FLUME_HDFS_BATCH_SIZE}
uev-agent.sinks.hdfssink.hdfs.batchInterval = ${FLUME_HDFS_BATCH_INTERVAL}
uev-agent.sinks.hdfssink.hdfs.rollSize = 134217728
uev-agent.sinks.hdfssink.hdfs.rollInterval = 300
uev-agent.sinks.hdfssink.hdfs.rollCount = 0
uev-agent.sinks.hdfssink.hdfs.useLocalTimeStamp = false
# 空文件不入库
uev-agent.sinks.hdfssink.hdfs.closeOnEOF = true

# ==============================================================================
# 校验
# ==============================================================================
# flume-ng version
# hdfs dfs -ls /uev/raw/
# hdfs dfs -cat /uev/raw/uev-*.csv | head -5
# ==============================================================================
