# ==============================================================================
# flume-env.conf —— Flume 环境变量配置
#
# 维护人：A（组长）　|　交付：11/24
#
# 说明：
#   本文件定义 Flume 运行所需的 JVM 参数与组件类路径。
#   部署方式二选一：
#     ① Docker 模式 —— 已包含在 apache/hadoop 镜像内，无需本文件
#     ② 原生模式   —— 复制到 $FLUME_HOME/conf/ 下生效
# ==============================================================================

# ---- Flume 进程标识 ----
# 同一台机器跑多个 Flume 实例时，用这个区分日志文件名
FLUME_AGENT_NAME=uev-agent

# ---- JVM 参数 ----
# 采集端内存建议 1-2G；日志多时调大
JAVA_OPTS="-Xms512m -Xmx2048m -Dcom.sun.management.jmxremote"

# ---- 组件类路径 ----
# 自动加载 $FLUME_HOME/lib 与 $FLUME_HOME/plugins 下的 jar
FLUME_CLASSPATH="$FLUME_HOME/plugins.d:$FLUME_HOME/lib"

# ---- 数据目录 ----
# Flume 的 checkpoint / 日志目录，必须可写
FLUME_LOG_DIR=/opt/flume/logs
FLUME_CHECKPOINT_DIR=/opt/flume/checkpoint

# ---- HDFS 缓冲 ----
# Sink 批量提交参数：攒够 100 条或 30 秒 flush 一次
# 答辩现场若嫌写入慢，可把 batchSize 调到 500
FLUME_HDFS_BATCH_SIZE=100
FLUME_HDFS_BATCH_INTERVAL=30000
